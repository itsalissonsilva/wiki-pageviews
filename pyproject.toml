[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "wiki-pageviews"
version = "0.1.0"
description = "Leakage-safe experiments for the Wikipedia web traffic forecasting challenge"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mlflow>=3.0,<4",
  "numpy>=1.26,<3",
  "optuna>=4.0,<5",
  "pandas>=2.2,<4",
  "pyarrow>=17,<24",
  "pyyaml>=6.0,<7",
  "scikit-learn>=1.5,<2",
]

[project.optional-dependencies]
boosting = ["lightgbm>=4.5,<5", "shap>=0.46,<1"]
neural = ["neuralforecast>=3.0,<4", "torch>=2.4,<3"]
dev = ["pytest>=8.3,<10", "ruff>=0.9,<1"]
all = [
  "lightgbm>=4.5,<5",
  "shap>=0.46,<1",
  "neuralforecast>=3.0,<4",
  "torch>=2.4,<3",
  "pytest>=8.3,<10",
  "ruff>=0.9,<1",
]

[project.scripts]
wiki-forecast = "wiki_pageviews.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/wiki_pageviews"]

[tool.pytest.ini_options]
addopts = "-q --basetemp=.tmp/pytest"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

