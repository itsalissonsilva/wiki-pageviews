experiment:
  name: wiki-pageviews-global-hgb
  seed: 42
  tags:
    stage: advanced

tracking:
  uri: sqlite:///mlflow.db

data:
  path: data/processed/train.parquet
  max_series: 20000
  fill_method: zero

validation:
  horizon: 60
  n_folds: 3
  step: 60
  min_train_days: 365

models:
  baselines:
    - name: seasonal_naive
      period: 7
    - name: seasonal_naive
      period: 364
  global_model:
    enabled: true
    estimator: hist_gradient_boosting
    params:
      learning_rate: 0.05
      max_iter: 300
      max_leaf_nodes: 63
      l2_regularization: 1.0
      min_samples_leaf: 30

features:
  lags: [1, 2, 3, 7, 14, 28, 56, 364]
  rolling_windows: [7, 14, 28, 56]

tuning:
  n_trials: 40
  timeout_seconds: 14400
  search_space:
    learning_rate: [0.015, 0.2]
    max_iter: [100, 600]
    max_leaf_nodes: [15, 127]
    l2_regularization: [0.0001, 10.0]
    min_samples_leaf: [10, 100]

output:
  directory: artifacts/advanced

